eureka:
  client:
    healthcheck:
      enabled: true #健康检查开启
    serviceUrl:
      defaultZone: http://localhost:6060/eureka/  #注册中心服务地址
spring:
  ## 从配置中心读取文件
  cloud:
    config:
      uri: http://localhost:6010/
      label: develop
      profile: dev
      name: service-producer
  application:
    name: service-producer    #当前服务ID
  zipkin:
    base-url: http://localhost:9411 #zipkin服务地址（官方独立发行版默认端口，旧版自建模块为 6040）
  sleuth:
    enabled: true #服务追踪开启
    sampler:
      probability: 1.0 #zipkin收集率（旧键 percentage 已更名为 probability）
  datasource: #数据库信息
    url: jdbc:mysql://127.0.0.1:3306/spring_cloud_demo?autoReconnect=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    # MySQL 驱动 5.1 → 8.0：驱动类更名 com.mysql.cj.jdbc.Driver
    driver-class-name: com.mysql.cj.jdbc.Driver
# Boot 1.5 的 management.security.enabled 已废除；2.x 默认只暴露少量端点，需显式放开
management:
  endpoints:
    web:
      exposure:
        include: "*"
#mybatis config
mybatis:
  type-aliases-package: com.wkedong.springcloud.serviceproducer.entity #entity实体对象所在的路径位置
