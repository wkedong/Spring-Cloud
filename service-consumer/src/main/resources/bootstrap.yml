eureka:
  client:
    healthcheck:
      enabled: true #健康检查开启
    serviceUrl:
      defaultZone: http://localhost:6060/eureka/  #注册中心服务地址
server:
  port: 7010  #当前服务端口
spring:
  ## 从配置中心读取文件
  cloud:
    config:
      uri: http://localhost:6010/
      label: develop
      profile: dev
      name: service-consumer
  application:
    name: service-consumer    #当前服务ID
  zipkin:
    base-url: http://localhost:9411 #zipkin服务地址（官方独立发行版默认端口，旧版自建模块为 6040）
  sleuth:
    enabled: true #服务追踪开启
    sampler:
      probability: 1.0 #zipkin收集率（旧键 percentage 已更名为 probability）

