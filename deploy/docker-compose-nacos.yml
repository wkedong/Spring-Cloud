# =============================================================================
# 可选编排：Nacos 单机版 + nacos-demo（对应 docs/24-Nacos注册与配置.md）
#
# 单独跑：
#   docker compose -f deploy/docker-compose-nacos.yml up -d
# 与主编排一起跑（两个文件合并，共用 spring-cloud-net 网络）：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose-nacos.yml up -d
#
# ⚠️ 同 deploy/docker-compose.yml：本机没有 Docker daemon，本文件未实跑，
#    只用 `docker-compose config` 做过静态校验。未核实之处见 deploy/README.md 第五节。
#
# ⚠️ 为什么 server-addr 用环境变量、而 instance-port 用命令行参数？
#    本机用 Spring Boot 的 ConfigurationPropertySources 实测过三种写法（见 docs/29 的实测表）：
#      spring.cloud.nacos.discovery.server-addr  ← SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR  ✅
#                                                ← SPRING_CLOUD_NACOS_DISCOVERY_SERVERADDR   ✅
#      spring.cloud.nacos.discovery.metadata.instance-port
#                                                ← ..._METADATA_INSTANCE_PORT   ❌ 会变成 instance.port
#                                                ← ..._METADATA_INSTANCE-PORT   ✅ 但环境变量名里带连字符太别扭
#    所以配置项本身用环境变量，**Map 里的 key** 用命令行参数（bootstrap.yml 的注释里
#    也是用 `--spring.cloud.nacos.discovery.metadata.instance-port=8211` 覆盖的）。
# =============================================================================

name: spring-cloud-nacos

services:

  # ---------------------------------------------------------------- Nacos Server
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: sc-nacos
    environment:
      MODE: standalone            # 单机模式：内嵌 Derby 存配置，不需要额外 MySQL
      TZ: Asia/Shanghai
      # 教学环境不开鉴权；生产必须打开并配合 NACOS_AUTH_TOKEN / IDENTITY_KEY
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"               # 控制台 + OpenAPI
      - "9848:9848"               # Nacos 2.x 客户端 gRPC：**必须一起映射**，否则客户端连不上
      - "9849:9849"               # gRPC（服务端推送 / 集群间）
    # 不设 healthcheck：官方镜像里可用的 HTTP 客户端不确定，写错会一直显示 unhealthy。
    # Nacos 单机版启动约 10~20 秒，下面的 demo 用 service_started + 应用侧重试来容忍。
    volumes:
      - nacos-data:/home/nacos/data
    networks: [spring-cloud-net]

  # ---------------------------------------------------------------- nacos-demo 实例 1（8210）
  nacos-demo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: nacos-demo
        APP_PORT: 8210
    image: spring-cloud/nacos-demo:0.0.1
    container_name: sc-nacos-demo
    environment:
      TZ: Asia/Shanghai
      # bootstrap.yml 里写的是 127.0.0.1:8848，容器里要指到服务名（实测两种写法都能绑定）
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      # 端口 8210 与元数据 instance-port=8210 都写在 bootstrap.yml 里，这里不用覆盖；
      # Spring profile 还是要从外部传：nacos-demo-dev.properties 这个 dataId 靠它算出来。
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8210:8210"
    depends_on:
      nacos:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8210/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s
    networks: [spring-cloud-net]

  # ---------------------------------------------------------------- nacos-demo 实例 2（8211）
  # 用来演示「注册中心里的多实例 + 配置热更新推送到所有实例」
  nacos-demo-peer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: nacos-demo
        APP_PORT: 8211
    image: spring-cloud/nacos-demo:0.0.1
    container_name: sc-nacos-demo-peer
    environment:
      TZ: Asia/Shanghai
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_PROFILES_ACTIVE: dev
    command:
      # 元数据是「静态」的：多实例必须按实例覆盖，否则两个实例在控制台上显示同一个端口
      - --spring.cloud.nacos.discovery.metadata.instance-port=8211
      # 本模块没有 profile 特定文件，端口只能从命令行覆盖
      - --server.port=8211
    ports:
      - "8211:8211"
    depends_on:
      nacos:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8211/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s
    networks: [spring-cloud-net]

# 网络名与主编排一致，两个文件合并时不会各建一套网络
networks:
  spring-cloud-net:
    driver: bridge

volumes:
  nacos-data:
