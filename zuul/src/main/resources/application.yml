# =============================================================================
# Spring Cloud Gateway 路由配置（替代原 Zuul 的 zuul.routes.*）
#
# 升到 Gateway 5（Spring Cloud 2025.1）时有两个**硬变更**，不改就是「静默失效」：
#   ① starter 更名：spring-cloud-starter-gateway → spring-cloud-starter-gateway-server-webflux
#   ② 配置前缀整体下移一层：spring.cloud.gateway.* → spring.cloud.gateway.server.webflux.*
#      旧前缀在 5.x 不会报错，只是**什么都不生效**：路由表为空、/actuator/gateway/routes 空数组。
#
# 另：配置中心接入改用 spring.config.import（Config Data API），
#     不再需要 bootstrap.yml 与 spring-cloud-starter-bootstrap。
# =============================================================================
server:
  port: 6050  #当前服务端口
spring:
  application:
    name: zuul    #当前服务ID（目录名沿用 zuul 历史名；实现已迁移为 Spring Cloud Gateway）
  # 配置中心：optional: 前缀 = 配置中心暂时不可用也允许启动
  config:
    import: optional:configserver:http://localhost:6010/
  cloud:
    config:
      label: develop
      profile: dev
      name: zuul
    gateway:
      server:
        webflux:
          # 按注册中心服务 id 自动生成路由：/service-producer/**、/service-consumer/** 等
          # （等价于 Zuul 开启 Ribbon 路由的默认行为）
          # 注意：locator 生成的是「裸路由」，不经过业务前缀，生产环境常关闭它只保留显式路由
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          # 显式路由示例：通过网关以 /api/producer/** 前缀访问 producer 服务
          routes:
            - id: service-producer
              uri: lb://service-producer #lb:// 表示从注册中心负载均衡取实例
              predicates:
                - Path=/api/producer/**
              filters:
                - StripPrefix=2 #剥掉前两段(/api/producer)再转发：/api/producer/testGet → producer 的 /testGet
            - id: service-consumer
              uri: lb://service-consumer
              predicates:
                - Path=/api/consumer/**
              filters:
                - StripPrefix=2
            # 重试演示路由：只对 5xx/异常重试（幂等 GET），单独一条便于对比「有重试 / 无重试」
            - id: service-producer-retry
              uri: lb://service-producer
              predicates:
                - Path=/api/retry/**
              filters:
                - StripPrefix=2
                - name: Retry
                  args:
                    retries: 2 #重试 2 次（总共最多 3 次请求）
                    series: SERVER_ERROR #5xx 系列
                    statuses: BAD_GATEWAY,INTERNAL_SERVER_ERROR
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false
          # 跨域：网关统一处理，业务服务不必各自配 CORS
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*" #允许的来源（教学放开；生产收窄到具体域名）
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          httpclient:
            connect-timeout: 2000 # 连接超时（毫秒）
            response-timeout: 10s # 响应超时：超过则网关返回 500/504
eureka:
  client:
    healthcheck:
      enabled: true #健康检查开启
    # 升级必改（Spring Cloud 2025.1 / Netflix 5.0.2）：Eureka 客户端已移除 Jersey 传输实现，
    #   但 eureka.client.jersey.enabled 的默认值仍是 true（matchIfMissing=true），
    #   结果是 RestClient 传输不会启用、客户端启动直接失败：
    #     No qualifying bean of type 'com.netflix.discovery.shared.transport.jersey.TransportClientFactories'
    #   本机实测：显式关掉后 Config Server 正常启动（RestClient 传输生效）。
    jersey:
      enabled: false
    # 升级必改（Spring Cloud 2025.1 / Netflix 5.0.2）：默认 Eureka 客户端是 refresh scope 的 bean，
    #   而 /actuator/health、/actuator/refresh 会触发 refresh scope 重建 —— 重建时
    #   RefreshableEurekaClientConfiguration 造 EurekaClient 抛 NPE：
    #     Fetch registry error at startup: null -> BeanCreationException: Failed to instantiate EurekaClient
    #   结果 health / refresh 两个端点直接 500（本机实测）。显式关掉 refresh scope 后走普通单例客户端，端点恢复 200。
    refresh:
      enable: false
    serviceUrl:
      defaultZone: http://localhost:6060/eureka/  #注册中心服务地址
# 自定义过滤器配置（AuthGlobalFilter / InMemoryRateLimitGlobalFilter 读取）
gateway:
  auth:
    token: dev-token
  ratelimit:
    capacity: 10 #窗口内允许的请求数
    window-seconds: 10 #窗口长度
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      # Gateway 5：management.endpoint.gateway.enabled 已被删除，改为 access（read-only/unrestricted/none）
      access: read-only #开启 /actuator/gateway/routes 端点，可在线查看路由表
    health:
      show-details: always
logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.wkedong.springcloud.zuul: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
