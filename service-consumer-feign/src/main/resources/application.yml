eureka:
  client:
    healthcheck:
      enabled: true #健康检查开启
    # 升级必改（Spring Cloud 2025.1 / Netflix 5.0.2）：Eureka 客户端已移除 Jersey 传输实现，
    #   但 eureka.client.jersey.enabled 的默认值仍是 true（matchIfMissing=true），
    #   结果是 RestClient 传输不会启用、客户端启动直接失败：
    #     No qualifying bean of type 'com.netflix.discovery.shared.transport.jersey.TransportClientFactories'
    #   本机实测：显式关掉后 Config Server 正常启动（RestClient 传输生效）。
    jersey:
      enabled: false
    # 升级必改（Spring Cloud 2025.1 / Netflix 5.0.2）：默认 Eureka 客户端是 refresh scope 的 bean，
    #   而 /actuator/health、/actuator/refresh 会触发 refresh scope 重建 —— 重建时
    #   RefreshableEurekaClientConfiguration 造 EurekaClient 抛 NPE：
    #     Fetch registry error at startup: null -> BeanCreationException: Failed to instantiate EurekaClient
    #   结果 health / refresh 两个端点直接 500（本机实测）。显式关掉 refresh scope 后走普通单例客户端，端点恢复 200。
    refresh:
      enable: false
    serviceUrl:
      defaultZone: http://localhost:6060/eureka/  #注册中心服务地址
server:
  port: 7020  #当前服务端口
spring:
  # 配置中心的接入方式（Boot 2.4+ 起的 Config Data API）：
  #   spring.config.import 取代了 bootstrap 上下文与 spring-cloud-starter-bootstrap
  #   optional: 前缀 = 配置中心暂时不可用也要能启动（本地开发/教学常用）
  config:
    import: optional:configserver:http://localhost:6010/
  ## 从配置中心读取文件（label / profile / name 依旧生效）
  cloud:
    config:
      label: develop
      profile: dev
      name: service-consumer-feign
    openfeign:
      # 开启后 Feign 调用会被 CircuitBreaker 包装，fallbackFactory 才会生效
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000   # 连接超时（毫秒）
            read-timeout: 2000      # 读超时：producer /testSlow?seconds=5 必然超时
            logger-level: full      # 等价于在 FeignConfig 里声明 Logger.Level.FULL
          service-producer:        # 按客户端名覆盖（优先级高于 default）
            connect-timeout: 2000
            read-timeout: 2000
  application:
    name: service-consumer-feign    #当前服务ID

# ============================ Feign 进阶配置（docs/17） ============================
# 升级硬变更：OpenFeign 的配置前缀在 Spring Cloud 2022 起换了家，5.0.3 已彻底不认旧前缀——
#   旧：feign.client.config.*            新：spring.cloud.openfeign.client.config.*
#   旧：feign.circuitbreaker.enabled     新：spring.cloud.openfeign.circuitbreaker.enabled
# 旧键不会报错，只是**静默失效**（本机实测：readTimeout 不生效，5s 的慢调用照样跑完 5.17s）。
# 为便于对照，配置仍集中写在这里：
#   spring.cloud.openfeign.client.config.default / <客户端名>：connect-timeout、read-timeout、logger-level
#   spring.cloud.openfeign.circuitbreaker.enabled：Feign 调用是否被 CircuitBreaker 包装（fallbackFactory 生效前提）

# Feign 日志级别最终还是由「客户端接口所在包」的日志级别决定
logging:
  level:
    com.wkedong.springcloud.serviceconsumer.feign.service: debug

# 暴露 actuator 端点：本模块要看 /actuator/circuitbreakers、/actuator/circuitbreakerevents
# （默认只暴露 health/info，不显式放开会 404 —— 实测确认过）
management:
  # ==================== 链路追踪：Micrometer Tracing（Sleuth 退役后的官方方案） ====================
  tracing:
    sampling:
      probability: 1.0 #采样率：1.0 = 全量上报（教学环境；生产按比例降采样）
  zipkin:
    tracing:
      # 上报地址要写到 v2 API 路径（Sleuth 的 spring.zipkin.base-url 只写到主机端口）
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# Resilience4j：Feign 的 circuitbreaker 包装使用这些默认配置
resilience4j:
  timelimiter:
    configs:
      default:
        # 比 Feign 的 readTimeout(2s) 略大，保证先看到 Feign 的超时行为
        timeout-duration: 3s
        cancel-running-future: true
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
