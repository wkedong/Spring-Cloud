eureka:
  client:
    healthcheck:
      enabled: true #健康检查开启
    # 升级必改（Spring Cloud 2025.1 / Netflix 5.0.2）：Eureka 客户端已移除 Jersey 传输实现，
    #   但 eureka.client.jersey.enabled 的默认值仍是 true（matchIfMissing=true），
    #   结果是 RestClient 传输不会启用、客户端启动直接失败：
    #     No qualifying bean of type 'com.netflix.discovery.shared.transport.jersey.TransportClientFactories'
    #   本机实测：显式关掉后 Config Server 正常启动（RestClient 传输生效）。
    jersey:
      enabled: false
    # 升级必改（Spring Cloud 2025.1 / Netflix 5.0.2）：默认 Eureka 客户端是 refresh scope 的 bean，
    #   而 /actuator/health、/actuator/refresh 会触发 refresh scope 重建 —— 重建时
    #   RefreshableEurekaClientConfiguration 造 EurekaClient 抛 NPE：
    #     Fetch registry error at startup: null -> BeanCreationException: Failed to instantiate EurekaClient
    #   结果 health / refresh 两个端点直接 500（本机实测）。显式关掉 refresh scope 后走普通单例客户端，端点恢复 200。
    refresh:
      enable: false
    serviceUrl:
      defaultZone: http://localhost:6060/eureka/  #注册中心服务地址
server:
  port: 7040  #当前服务端口
spring:
  # 配置中心的接入方式（Boot 2.4+ 起的 Config Data API）：
  #   spring.config.import 取代了 bootstrap 上下文与 spring-cloud-starter-bootstrap
  #   optional: 前缀 = 配置中心暂时不可用也要能启动（本地开发/教学常用）
  config:
    import: optional:configserver:http://localhost:6010/
  ## 从配置中心读取文件（label / profile / name 依旧生效）
  cloud:
    config:
      label: develop
      profile: dev
      name: service-consumer-ribbon-hystrix
  application:
    name: service-consumer-ribbon-hystrix    #当前服务ID
# Boot 1.5 的 management.security.enabled 已废除；Boot 4 用 exposure.include 控制暴露面
# 放开 actuator 后可通过 /actuator/circuitbreakers、/actuator/circuitbreakerevents 观察熔断状态
management:
  # ==================== 链路追踪：Micrometer Tracing（Sleuth 退役后的官方方案） ====================
  tracing:
    sampling:
      probability: 1.0 #采样率：1.0 = 全量上报（教学环境；生产按比例降采样）
  zipkin:
    tracing:
      # 上报地址要写到 v2 API 路径（Sleuth 的 spring.zipkin.base-url 只写到主机端口）
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: "*"
# Resilience4j 熔断器配置（替代原 HystrixCommand 的超时/熔断语义）
resilience4j:
  timelimiter:
    configs:
      default:
        # 默认 1s；producer 的 /testHystrix 故意睡 5s，超时即触发 fallback
        timeout-duration: 3s
        cancel-running-future: true
    instances:
      # 超时演示专用：给 /resilience/timelimiter 用 1s 的短超时
      slowCall:
        timeout-duration: 1s
        cancel-running-future: true
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10 #滑动窗口统计 10 次调用
        failure-rate-threshold: 50 #失败率阈值 50% 打开熔断
        wait-duration-in-open-state: 10s #熔断打开后等待 10s 进入半开
    instances:
      slowCall:
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 60
        wait-duration-in-open-state: 5s
      decoratedDemo:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
  # ==================== 全家桶其余成员（docs/20） ====================
  retry:
    configs:
      default:
        max-attempts: 3 #最多尝试 3 次（含第一次）
        wait-duration: 200ms #每次重试间隔（可配指数退避）
        retry-exceptions:
          - java.lang.IllegalStateException
          - org.springframework.web.client.ResourceAccessException
    instances:
      decoratedRetry:
        max-attempts: 2
        wait-duration: 100ms
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 2 #同时只允许 2 个并发
        max-wait-duration: 0 #不等待，满了直接拒绝（BulkheadFullException）
    instances:
      decoratedBulkhead:
        max-concurrent-calls: 5
  ratelimiter:
    configs:
      default:
        limit-for-period: 3 #每个周期允许 3 次
        limit-refresh-period: 10s #周期长度 10 秒
        timeout-duration: 0 #不等待，直接拒绝（RequestNotPermitted）

