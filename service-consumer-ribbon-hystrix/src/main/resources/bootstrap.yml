eureka:
  client:
    healthcheck:
      enabled: true #健康检查开启
    serviceUrl:
      defaultZone: http://localhost:6060/eureka/  #注册中心服务地址
server:
  port: 7040  #当前服务端口
spring:
  ## 从配置中心读取文件
  cloud:
    config:
      uri: http://localhost:6010/
      label: develop
      profile: dev
      name: service-consumer-ribbon-hystrix
  application:
    name: service-consumer-ribbon-hystrix    #当前服务ID
  zipkin:
    base-url: http://localhost:9411 #zipkin服务地址（官方独立发行版默认端口，旧版自建模块为 6040）
  sleuth:
    enabled: true #服务追踪开启
    sampler:
      probability: 1.0 #zipkin收集率（旧键 percentage 已更名为 probability）
# Boot 1.5 的 management.security.enabled 已废除；2.x 需显式放开端点
# 放开 actuator 后可通过 /actuator/circuitbreakers、/actuator/circuitbreakerevents 观察熔断状态
management:
  endpoints:
    web:
      exposure:
        include: "*"
# Resilience4j 熔断器配置（替代原 HystrixCommand 的超时/熔断语义）
resilience4j:
  timelimiter:
    configs:
      default:
        # 默认 1s；producer 的 /testHystrix 故意睡 5s，超时即触发 fallback
        timeout-duration: 3s
        cancel-running-future: true
    instances:
      # 超时演示专用：给 /resilience/timelimiter 用 1s 的短超时
      slowCall:
        timeout-duration: 1s
        cancel-running-future: true
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10 #滑动窗口统计 10 次调用
        failure-rate-threshold: 50 #失败率阈值 50% 打开熔断
        wait-duration-in-open-state: 10s #熔断打开后等待 10s 进入半开
    instances:
      slowCall:
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 60
        wait-duration-in-open-state: 5s
      decoratedDemo:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
  # ==================== 全家桶其余成员（docs/20） ====================
  retry:
    configs:
      default:
        max-attempts: 3 #最多尝试 3 次（含第一次）
        wait-duration: 200ms #每次重试间隔（可配指数退避）
        retry-exceptions:
          - java.lang.IllegalStateException
          - org.springframework.web.client.ResourceAccessException
    instances:
      decoratedRetry:
        max-attempts: 2
        wait-duration: 100ms
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 2 #同时只允许 2 个并发
        max-wait-duration: 0 #不等待，满了直接拒绝（BulkheadFullException）
    instances:
      decoratedBulkhead:
        max-concurrent-calls: 5
  ratelimiter:
    configs:
      default:
        limit-for-period: 3 #每个周期允许 3 次
        limit-refresh-period: 10s #周期长度 10 秒
        timeout-duration: 0 #不等待，直接拒绝（RequestNotPermitted）

